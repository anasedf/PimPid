name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PimPid.exe
        shell: cmd
        run: build.bat

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PimPid
          path: PimPid.exe

      # push tag เช่น v1.0.0 -> สร้างหน้า Release พร้อมแนบ PimPid.exe ให้อัตโนมัติ
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PimPid.exe
          generate_release_notes: true
